<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f3f0">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel del equipo · Observatorio urbano</title>
  <link rel="icon" type="image/svg+xml" href="../logo-marca.svg">
  <link rel="stylesheet" href="../css/estilo.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="../js/tema.js"></script>
  <script type="module" src="admin.js"></script>
</head>
<body class="panel">
  <header class="barra">
    <div class="barra-interior">
      <img class="marca" src="../logo-marca.svg" alt="" width="44" height="44">
      <div class="titulos"><strong>Observatorio urbano</strong><span>Panel del equipo · Loja</span></div>
      <div class="barra-acciones" id="acciones" hidden></div>
    </div>
  </header>

  <main class="ancho">
    <section class="tarjeta acceso" id="acceso" aria-labelledby="titulo-acceso">
      <div class="sello-login"><svg class="icono"><use href="/iconos.svg#i-escudo"/></svg></div>
      <h1 class="paso-titulo" id="titulo-acceso">Panel del equipo</h1>
      <p class="paso-ayuda">Entra con la clave de administrador.</p>
      <form id="formulario-acceso" autocomplete="off">
        <input type="password" id="clave" placeholder="Clave de administrador" aria-label="Clave de administrador" autocomplete="current-password" required>
        <div class="alerta error" id="error-acceso" role="alert" hidden><svg class="icono"><use href="/iconos.svg#i-alerta"/></svg><p></p></div>
        <button type="submit" class="boton boton-primario boton-ancho" id="boton-entrar">Entrar</button>
      </form>
    </section>

    <div id="app" hidden>
      <nav class="pestanas panel-nav" id="nav" aria-label="Secciones del panel"></nav>
      <div id="contenido-panel">
        <section class="vista" id="vista-inicio" hidden></section>
        <section class="vista" id="vista-mapa" hidden></section>
        <section class="vista" id="vista-reportes" hidden></section>
        <section class="vista" id="vista-calidad" hidden></section>
        <section class="vista" id="vista-gente" hidden></section>
        <section class="vista" id="vista-sistema" hidden></section>
        <section class="vista" id="vista-defensa" hidden></section>
      </div>
    </div>
  </main>

  <dialog id="hoja" class="hoja"></dialog>
  <dialog id="mas" class="hoja hoja-mas"></dialog>
  <dialog id="dialogo" class="dialogo"></dialog>
  <div class="avisos" id="avisos" aria-live="polite"></div>
</body>
</html>
